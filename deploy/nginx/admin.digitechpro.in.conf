# LMSOld admin — nginx reverse proxy (optional alternative to Caddy)
#
# Prerequisites: nginx + certbot (or another ACME client).
# DNS A record for admin.digitechpro.in → this server; security group 80 + 443.
#
# Example install path:
#   sudo cp deploy/nginx/admin.digitechpro.in.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/admin.digitechpro.in.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d admin.digitechpro.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# On a shared host with lms.digitechpro.in, enable both site configs and ensure
# only nginx (or only Caddy) binds :80/:443 — not both, and not docker-proxy on 80.
#
# Upstream: combined SPA + API → 127.0.0.1:3001 (lmsold-app)

upstream lmsold_app {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.digitechpro.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.digitechpro.in;

    # Paths after `certbot --nginx` (adjust if your distro differs):
    ssl_certificate     /etc/letsencrypt/live/admin.digitechpro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.digitechpro.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://lmsold_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
