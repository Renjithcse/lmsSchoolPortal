# LMSOld admin — single combined service (CRA SPA + Express API in one container).
# Mongo is a separate compose stack on external network `lmsold_net`
# (hostname `mongodb`). Do not start Mongo here.
#
# Domain deploy (override via .env — e.g. https://admin.example.com):
#   - Secrets stay in .env via env_file (never bake into the image).
#   - Set FRONTEND_URL=https://YOUR_ADMIN_HOST in .env (CORS + Secure cookies).
#   - Deploy helper: LMSOLD_PUBLIC_URL=https://YOUR_ADMIN_HOST ./deploy.sh
#     (optionally SYNC_FRONTEND_URL=1 / INSTALL_CADDY=1 — see docs/DEPLOY.md).
#   - Caddy/nginx TLS on the host → prefer loopback bind below.
#   - Caddy site name must match FRONTEND_URL host → 127.0.0.1:3001
#     (Express serves /api, /uploads, and the SPA).
# Full runbook: docs/DEPLOY.md
#
# Run from this directory (lmsold/), not a parent monorepo folder.
# Plain deploy folder: sync schoolbackend/ + SchoolPortalAdmin/ + deploy files
# onto the server together. See docs/DEPLOY.md.
#
# Prerequisite: create/attach Mongo on the same external network, e.g.
#   networks: { lmsold_net: { external: true } }  # or name: lmsold_net

name: lmsold

services:
  lmsold-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lmsold-app:latest
    container_name: lmsold-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Do not set MONGO_URI / FRONTEND_URL / token secrets here — compose
      # `environment` always wins over env_file. Put them in .env only
      # (use hostname `mongodb` on lmsold_net; encode @ in passwords as %40).
    volumes:
      - lmsold_uploads:/app/public/uploads
    ports:
      # With Caddy/nginx TLS on the host, prefer loopback (recommended):
      # - "127.0.0.1:3001:3001"
      # Do NOT publish host :80 — Caddy owns 80/443.
      - "127.0.0.1:3001:3001"
    networks:
      - lmsold_net
    restart: unless-stopped

volumes:
  lmsold_uploads:

networks:
  lmsold_net:
    external: true
    name: lmsold_net
